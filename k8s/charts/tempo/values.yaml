image:
  repository: grafana/tempo
  tag: "2.10.10"

# How long traces are kept. Storage is an emptyDir: traces also reset whenever the
# pod or the (daily rebuilt) cluster is recreated, which is fine for request traces.
retention: 72h
storageSizeLimit: 2Gi

# Service graph + span metrics, written into Prometheus (needs its remote-write
# receiver enabled). Powers Grafana's "Service Graph" for the Tempo datasource.
metricsGenerator:
  enabled: true
  remoteWriteUrl: http://kps-prometheus.monitoring.svc:9090/api/v1/write

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 768Mi
