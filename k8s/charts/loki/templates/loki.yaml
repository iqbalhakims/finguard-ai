{{- $labels := dict "app.kubernetes.io/name" "loki" "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/managed-by" .Release.Service "helm.sh/chart" (printf "%s-%s" .Chart.Name .Chart.Version) -}}
{{- $selector := dict "app.kubernetes.io/name" "loki" -}}
{{- $config := include "loki.config" . -}}
{{- $p := .Values.persistence -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  labels:
    {{- toYaml $labels | nindent 4 }}
data:
  loki.yaml: |
    {{- $config | nindent 4 }}
{{- if $p.volumeHandle }}
---
# Pre-provisioned disk from Terraform (output loki_volume_id), already formatted ext4.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: loki-data
  labels:
    {{- toYaml $labels | nindent 4 }}
  annotations:
    pv.kubernetes.io/provisioned-by: dobs.csi.digitalocean.com
spec:
  storageClassName: {{ $p.storageClassName }}
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: {{ $p.size }}
  accessModes: ["ReadWriteOnce"]
  csi:
    driver: dobs.csi.digitalocean.com
    fsType: ext4
    volumeHandle: {{ $p.volumeHandle }}
    volumeAttributes:
      com.digitalocean.csi/noformat: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  storageClassName: {{ $p.storageClassName }}
  volumeName: loki-data
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # ReadWriteOnce disk: the old pod must let go of it first
  selector:
    matchLabels:
      {{- toYaml $selector | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $labels | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
            - { name: grpc, containerPort: 9095 }
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /var/loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: loki
        - name: data
          {{- if $p.volumeHandle }}
          persistentVolumeClaim:
            claimName: loki-data
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.emptyDirSizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    {{- toYaml $labels | nindent 4 }}
spec:
  selector:
    {{- toYaml $selector | nindent 4 }}
  ports:
    - { name: http, port: 3100, targetPort: http }
    - { name: grpc, port: 9095, targetPort: grpc }
