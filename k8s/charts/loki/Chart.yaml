apiVersion: v2
name: loki
description: >-
  Grafana Loki in single-binary mode for a small cluster: OTLP logs in, local
  filesystem storage, query API for Grafana. (Grafana's `loki` chart defaults to
  memcached caches, a canary and a gateway sized for production: ~9 GB of requests.)
type: application
