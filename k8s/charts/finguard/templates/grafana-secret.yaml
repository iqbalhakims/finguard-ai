{{- if .Values.grafana.enabled }}
{{- $a := .Values.grafana.admin -}}
{{- if $a.sealedPassword }}
# Encrypted with the cluster's Sealed Secrets key (kubeseal --raw, strict scope:
# only this name in this namespace can decrypt it). The controller turns it into
# a normal Secret named {{ $a.secretName }}.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $a.secretName }}
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    password: {{ $a.sealedPassword }}
  template:
    metadata:
      name: {{ $a.secretName }}
      labels:
        {{- include "finguard.labels" . | nindent 8 }}
{{- else if $a.password }}
# Plain Secret: local/dev installs only. Use sealedPassword for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $a.secretName }}
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $a.password | quote }}
{{- end }}
{{- end }}
