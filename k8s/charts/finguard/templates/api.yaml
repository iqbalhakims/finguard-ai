{{- $sel := dict "name" "finguard-api" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: finguard-api-config
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.api.config | nindent 2 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finguard-api
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
    {{- include "finguard.selector" $sel | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # never drop below current capacity during a model rollout
  selector:
    matchLabels:
      {{- include "finguard.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finguard.labels" . | nindent 8 }}
        {{- include "finguard.selector" $sel | nindent 8 }}
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
        checksum/config: {{ toYaml .Values.api.config | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "finguard.podSecurity" (dict "root" . "extra" (dict "runAsUser" 10001 "runAsGroup" 10001)) | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "finguard.selector" $sel | nindent 14 }}
      containers:
        - name: api
          image: {{ include "finguard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: finguard-api-config
          env:
            - name: HOME
              value: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # let the Service drop this endpoint before Uvicorn stops accepting
                command: ["sleep", "5"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: finguard-api
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
    {{- include "finguard.selector" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "finguard.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.autoscaling.enabled }}
---
# Requires metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finguard-api
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finguard-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: finguard-api
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "finguard.selector" $sel | nindent 6 }}
{{- end }}
