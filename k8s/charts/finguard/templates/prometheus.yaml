{{- if .Values.prometheus.enabled }}
{{- $sel := dict "name" "prometheus" -}}
{{- $p := .Values.prometheus -}}
# In-namespace Prometheus: discovers annotated pods (namespaced Role only) and scrapes
# each pod directly so per-replica counters and drift windows are not mixed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-discovery
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discovery
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    {{- tpl (.Files.Get "files/prometheus/prometheus.yml") . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
data:
  # Not passed through tpl: alert annotations use Prometheus' own {{ "{{ }}" }} templates.
  alerts.yml: |
    {{- .Files.Get "files/prometheus/alerts.yml" | nindent 4 }}
{{- if $p.persistence.enabled }}
{{- if $p.persistence.volumeHandle }}
---
# Static PersistentVolume for a pre-provisioned volume (e.g. Terraform-managed).
# Kubernetes only mounts it; Retain keeps the disk if this object is deleted.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Namespace }}-prometheus
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
  annotations:
    pv.kubernetes.io/provisioned-by: {{ $p.persistence.csiDriver }}
spec:
  storageClassName: {{ $p.persistence.storageClassName | quote }}
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: {{ $p.persistence.size }}
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: prometheus-data
  csi:
    driver: {{ $p.persistence.csiDriver }}
    fsType: {{ $p.persistence.fsType }}
    volumeHandle: {{ $p.persistence.volumeHandle }}
    volumeAttributes:
      com.digitalocean.csi/noformat: "true"   # already formatted by its creator
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
spec:
  {{- if $p.persistence.volumeHandle }}
  # must match the static PV exactly (even ""), or the default class is used instead
  storageClassName: {{ $p.persistence.storageClassName | quote }}
  volumeName: {{ .Release.Namespace }}-prometheus
  {{- else if $p.persistence.storageClassName }}
  storageClassName: {{ $p.persistence.storageClassName }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $p.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
    {{- include "finguard.selector" $sel | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate          # single writer on the (ReadWriteOnce) TSDB volume
  selector:
    matchLabels:
      {{- include "finguard.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "finguard.labels" . | nindent 8 }}
        {{- include "finguard.selector" $sel | nindent 8 }}
        app.kubernetes.io/component: monitoring
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/prometheus/prometheus.yml") . | sha256sum | trunc 16 }}
        checksum/rules: {{ .Files.Get "files/prometheus/alerts.yml" | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: prometheus
      securityContext:
        {{- include "finguard.podSecurity" (dict "root" . "extra" (dict "runAsUser" 65534 "runAsGroup" 65534 "fsGroup" 65534)) | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ $p.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention.time }}
            {{- with $p.retention.size }}
            - --storage.tsdb.retention.size={{ . }}
            {{- end }}
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          {{- if $p.persistence.enabled }}
          persistentVolumeClaim:
            claimName: prometheus-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    {{- include "finguard.labels" . | nindent 4 }}
    {{- include "finguard.selector" $sel | nindent 4 }}
spec:
  selector:
    {{- include "finguard.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- end }}
