# Install in the same namespace as the backend Service (no ReferenceGrant needed).

gatewayClassName: cilium

# Annotations for the LoadBalancer Service the Gateway controller creates.
loadBalancerAnnotations: {}

# Public hostname (DNS A record -> Gateway address). Empty = create the Gateway
# only, so its IP can be read first; HTTPS, routes and certificate come once set.
host: ""

backend:
  service: grafana
  port: 80

# More public hosts on the same Gateway, load balancer and certificate (only when
# `host` is set). `namespace` = the Service lives elsewhere; a ReferenceGrant is
# created there so the route may reach it.
#   - name: argocd                 # route name suffix
#     host: argo.example.com
#     service: argocd-server
#     namespace: argocd
#     port: 80
extraRoutes: []

# DNS TTL (seconds) that external-dns sets for the host record; empty = provider default.
dnsTtl: ""

tls:
  secretName: public-gateway-tls
  acmeServer: https://acme-v02.api.letsencrypt.org/directory
  acmeEmail: ""      # optional: Let's Encrypt expiry notices
