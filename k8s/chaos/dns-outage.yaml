# DNS outage: the traffic simulator cannot reach CoreDNS, so it cannot resolve finguard-api
#
# Hubble UI: DROPPED "Policy denied" flows traffic-simulator -> kube-system/coredns on
#   UDP :53, and no traffic at all to finguard-api (the name never resolves).
# Elsewhere: simulator errors "Temporary failure in name resolution"; its traces stop too
#   (otel-collector is a DNS name as well).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: chaos-dns-outage
  namespace: finguard
  labels:
    chaos.finguard.io/scenario: dns-outage
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traffic-simulator
  egress:
    - toEntities: ["all"]
  egressDeny:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
