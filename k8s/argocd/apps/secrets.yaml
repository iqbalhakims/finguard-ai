# All SealedSecrets for the cluster live in k8s/secrets/ (one file each, created by
# `make doks-seal-grafana` / `make doks-seal-cloudflare`). Only this cluster's
# Sealed Secrets key can decrypt them; `make doks-backup` / `doks-restore` carry
# that key across cluster rebuilds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/iqbalhakims/finguard-ai.git
    targetRevision: main
    path: k8s/secrets
    directory:
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default        # each SealedSecret names its own namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:                    # target namespaces are created by the monitoring / external-dns apps
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
