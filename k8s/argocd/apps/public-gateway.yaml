# Public HTTPS endpoint for Grafana: Cilium Gateway + Let's Encrypt (cert-manager),
# in the monitoring namespace next to kube-prometheus-stack's Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/iqbalhakims/finguard-ai.git
    targetRevision: main
    path: k8s/charts/public-gateway
    helm:
      releaseName: public-gateway
      valueFiles:
        - ../../values/public-gateway.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
