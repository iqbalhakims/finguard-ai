# Hubble UI at https://hubble.iqbalhakim.site, behind a password. DOKS already runs
# Hubble (relay + UI in kube-system); the UI has no login, so the public Gateway routes
# to this basic-auth proxy (k8s/charts/hubble-auth) instead.
# Login: admin / k8s/.secrets/hubble-ui-password (sealed by `make doks-seal-hubble`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hubble-auth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/iqbalhakims/finguard-ai.git
    targetRevision: main
    path: k8s/charts/hubble-auth
    helm:
      releaseName: hubble-auth
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
