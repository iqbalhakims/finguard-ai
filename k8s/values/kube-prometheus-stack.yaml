# kube-prometheus-stack 92.17.0 on DOKS (Argo CD app: k8s/argocd/apps/kube-prometheus-stack.yaml).
# Picks up FinGuard's ServiceMonitor, PrometheusRule and dashboard ConfigMap from any namespace.

fullnameOverride: kps

# DOKS manages the control plane, and Cilium replaces kube-proxy: nothing to scrape there.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  # Hubble (Cilium's flow observability, run by DOKS) exposes network metrics on every
  # node: drops by reason, HTTP/DNS seen by Cilium, TCP flags. Used by the
  # "FinGuard AI — Outage" dashboard (k8s/charts/finguard/files/grafana/dashboards/outage.json).
  additionalServiceMonitors:
    - name: hubble
      namespaceSelector:
        matchNames: [kube-system]
      selector:
        matchLabels:
          k8s-app: hubble              # only the DOKS-managed hubble-metrics Service
      endpoints:
        - port: hubble-metrics         # :9965 on each node
          interval: 30s
  prometheusSpec:
    # Select ServiceMonitors / PodMonitors / PrometheusRules from every namespace,
    # without requiring a `release: ...` label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Keep trace_id exemplars from the FinGuard API (latency histogram -> Tempo trace).
    enableFeatures:
      - exemplar-storage
    # Tempo's metrics-generator writes service-graph and span metrics here
    # (in-cluster only: the Prometheus Service is ClusterIP).
    enableRemoteWriteReceiver: true
    retention: 15d
    retentionSize: 4GB
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi
    # TSDB on the Terraform-managed block storage volume (terraform/main.tf),
    # bound through the static PersistentVolume in extraManifests below.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          volumeName: kps-prometheus-data
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

grafana:
  fullnameOverride: grafana
  admin:
    existingSecret: grafana-admin     # SealedSecret: k8s/secrets/grafana-admin.yaml
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    security:
      cookie_secure: true
    server:
      # Public URL served by the Cilium Gateway. `make doks-set-host HOST=...` sets the
      # domain here and the host in k8s/values/public-gateway.yaml together.
      domain: grafana.iqbalhakim.site
      root_url: "https://%(domain)s/"
  # Traces from Tempo (k8s/charts/tempo, fed by the OpenTelemetry Collector) and logs
  # from Loki (k8s/charts/loki), linked both ways.
  additionalDataSources:
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc:3200
      jsonData:
        nodeGraph:
          enabled: true
        search:
          hide: false
        # "Service Graph" tab: Tempo's metrics-generator writes traces_service_graph_* here.
        serviceMap:
          datasourceUid: prometheus
        # "Logs for this span": the span's service.name is the Loki label service_name
        # (set by the otel-agent), and FinGuard log lines carry trace_id=<id>.
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          filterByTraceID: true
          tags:
            - key: service.name
              value: service_name
    # Logs from every pod (k8s/charts/loki, shipped by the otel-agent DaemonSet).
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc:3100
      jsonData:
        maxLines: 1000
        # trace_id=<32 hex> in FinGuard log lines (finguard/api/app.py) -> trace in Tempo.
        derivedFields:
          - name: TraceID
            matcherRegex: "trace_id=([0-9a-f]{32})"
            datasourceUid: tempo
            url: "$${__value.raw}"
            urlDisplayLabel: View trace
  sidecar:
    datasources:
      # Exemplar dots on Prometheus panels link to the trace in Tempo.
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 192Mi

extraManifests:
  # Pre-provisioned disk from Terraform (output prometheus_volume_id).
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: kps-prometheus-data
      annotations:
        pv.kubernetes.io/provisioned-by: dobs.csi.digitalocean.com
    spec:
      storageClassName: do-block-storage
      persistentVolumeReclaimPolicy: Retain
      capacity:
        storage: 5Gi
      accessModes: ["ReadWriteOnce"]
      csi:
        driver: dobs.csi.digitalocean.com
        fsType: ext4
        volumeHandle: 4fc64312-e101-11f1-a820-2e8a79e9469b   # terraform output prometheus_volume_id
        volumeAttributes:
          com.digitalocean.csi/noformat: "true"
