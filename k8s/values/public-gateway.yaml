# Public Grafana, Argo CD, OTLP ingest, Hubble UI, Wazuh and Falco UI on DOKS (Argo CD app: k8s/argocd/apps/public-gateway.yaml),
# installed in the "monitoring" namespace next to kube-prometheus-stack's Grafana.
gatewayClassName: cilium
loadBalancerAnnotations:
  service.beta.kubernetes.io/do-loadbalancer-name: finguard-public
  service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"

host: grafana.iqbalhakim.site

backend:
  service: grafana   # kube-prometheus-stack Grafana (grafana.fullnameOverride)
  port: 80

extraRoutes:
  - name: argocd
    host: argo.iqbalhakim.site
    service: argocd-server   # plain HTTP: server.insecure in k8s/bootstrap/argocd-values.yaml
    namespace: argocd
    port: 80
  # OTLP/HTTP ingest for apps outside the cluster (POST /v1/traces). Port 4319 requires
  # "Authorization: Bearer <token>" (k8s/.secrets/otel-ingest-token); 4317/4318 stay internal.
  - name: otel
    host: otel.iqbalhakim.site
    service: otel-collector
    namespace: observability
    port: 4319
  # Hubble UI (Cilium network flows; DOKS runs it in kube-system). It has no login, so the
  # route goes to a basic-auth proxy in this namespace (k8s/charts/hubble-auth), never to
  # hubble-ui directly. Login: admin / k8s/.secrets/hubble-ui-password.
  - name: hubble
    host: hubble.iqbalhakim.site
    service: hubble-auth
    port: 80
  # Wazuh dashboard (SIEM, k8s/charts/wazuh), plain HTTP behind the Gateway. Has its own
  # login: admin / k8s/.secrets/wazuh/indexer-admin-password.
  - name: wazuh
    host: wazuh.iqbalhakim.site
    service: wazuh-dashboard
    namespace: wazuh
    port: 5601
  # Falcosidekick UI (Falco runtime events, k8s/values/falco.yaml). Has its own login:
  # admin / k8s/.secrets/falco-ui-password (SealedSecret falcosidekick-ui-auth).
  - name: falco
    host: falco.iqbalhakim.site
    service: falco-falcosidekick-ui
    namespace: falco
    port: 2802

# external-dns keeps the Cloudflare record on the current Gateway IP (k8s/argocd/apps/external-dns.yaml)
dnsTtl: 60
