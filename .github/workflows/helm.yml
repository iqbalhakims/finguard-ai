# Lint and render everything Argo CD will deploy, before it reaches main.
name: helm

on:
  push:
    branches: [main]
    paths: ["k8s/**", ".github/workflows/helm.yml"]
  pull_request:
    branches: [main]
    paths: ["k8s/**", ".github/workflows/helm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & render charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Helm version (preinstalled on the runner)
        run: helm version --short

      - name: Lint and render the FinGuard and public-gateway charts
        run: make helm-lint

      - name: Render kube-prometheus-stack with our values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          version=$(yq '.spec.sources[0].targetRevision' k8s/argocd/apps/kube-prometheus-stack.yaml)
          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version "$version" -n monitoring -f k8s/values/kube-prometheus-stack.yaml > /dev/null

      - name: Argo CD Applications are valid YAML
        run: |
          for f in k8s/argocd/root.yaml k8s/argocd/apps/*.yaml; do
            yq -e '.kind == "Application"' "$f" > /dev/null || { echo "not an Application: $f"; exit 1; }
          done
