# Synthetic card traffic so the dashboards have something to show.
# Drift demo:  kubectl -n finguard set env deployment/traffic-simulator SIMULATOR_DRIFT=true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
  labels:
    app.kubernetes.io/name: traffic-simulator
    app.kubernetes.io/component: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic-simulator
        app.kubernetes.io/component: load-generator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: finguard-api
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "finguard.simulate"]
          env:
            - name: SIMULATOR_URL
              value: http://finguard-api
            - name: SIMULATOR_RPS
              value: "10"
            - name: SIMULATOR_DRIFT
              value: "false"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
