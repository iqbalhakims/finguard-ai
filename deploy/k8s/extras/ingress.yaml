# Example ingress (ingress-nginx). minikube: `minikube addons enable ingress`,
# then map finguard.local and grafana.finguard.local to `minikube ip` in /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finguard
  namespace: finguard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: finguard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finguard-api
                port:
                  name: http
    - host: grafana.finguard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
