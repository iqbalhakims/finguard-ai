# Whole FinGuard stack on Kubernetes:  kubectl --context <ctx> apply -k deploy/
# Lives at deploy/ (not deploy/k8s/) so the generators below can read the
# monitoring configs shared with docker-compose without duplicating them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: finguard

labels:
  - pairs:
      app.kubernetes.io/part-of: finguard
    includeSelectors: false

resources:
  - k8s/app/namespace.yaml
  - k8s/app/configmap.yaml
  - k8s/app/deployment.yaml
  - k8s/app/service.yaml
  - k8s/app/hpa.yaml
  - k8s/app/pdb.yaml
  - k8s/app/simulator.yaml
  - k8s/monitoring/prometheus.yaml
  - k8s/monitoring/grafana.yaml

images:
  - name: finguard-api
    newName: finguard-api
    newTag: 0.1.0

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/prometheus/prometheus-k8s.yml
  - name: prometheus-rules
    files:
      - monitoring/prometheus/alerts.yml
  - name: grafana-datasources
    files:
      - monitoring/grafana/provisioning/datasources/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - monitoring/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboards
    files:
      - monitoring/grafana/dashboards/finguard.json

secretGenerator:
  - name: grafana-admin
    literals:
      - password=admin        # demo only: replace with a real secret (e.g. External Secrets / SOPS)
