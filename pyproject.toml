[project]
name = "finguard"
version = "0.1.0"
description = "FinGuard AI — miniature banking fraud detection platform"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["finguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py312"
