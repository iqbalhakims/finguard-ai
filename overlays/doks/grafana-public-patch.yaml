# Grafana served publicly at https://$PUBLIC_HOST/: login required, secure cookies,
# no self sign-up. Log in as admin with the password in overlays/doks/grafana.env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_SERVER_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: finguard-public
                  key: PUBLIC_HOST
            - name: GF_SERVER_ROOT_URL
              value: "https://%(domain)s/"
