# Prometheus on DOKS: TSDB on the persistent volume instead of emptyDir, and a
# longer retention now that history survives restarts (capped below the 5 GiB disk).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  template:
    spec:
      containers:
        - name: prometheus
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=4GB
            - --web.enable-lifecycle
      volumes:
        - name: data
          emptyDir: null
          persistentVolumeClaim:
            claimName: prometheus-data
