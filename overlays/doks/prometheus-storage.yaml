# Static PersistentVolume for the block storage volume created by Terraform
# (terraform/main.tf: digitalocean_volume.prometheus). The DigitalOcean CSI driver
# attaches it to whichever node runs Prometheus. Kubernetes never creates or
# deletes this disk; Terraform owns it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: finguard-prometheus
  annotations:
    pv.kubernetes.io/provisioned-by: dobs.csi.digitalocean.com
spec:
  storageClassName: do-block-storage
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  csi:
    driver: dobs.csi.digitalocean.com
    fsType: ext4
    volumeHandle: 4fc64312-e101-11f1-a820-2e8a79e9469b   # terraform output prometheus_volume_id
    volumeAttributes:
      com.digitalocean.csi/noformat: "true"           # Terraform already formatted it (ext4)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  storageClassName: do-block-storage
  volumeName: finguard-prometheus
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
