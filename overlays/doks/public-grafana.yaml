# Public HTTPS endpoint for Grafana: DigitalOcean Load Balancer (TCP 80/443)
# -> Caddy (TLS termination, Let's Encrypt) -> grafana:3000.
# The API and Prometheus stay ClusterIP-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: finguard-caddy
  annotations:
    pv.kubernetes.io/provisioned-by: dobs.csi.digitalocean.com
spec:
  storageClassName: do-block-storage
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  csi:
    driver: dobs.csi.digitalocean.com
    fsType: ext4
    volumeHandle: REPLACE_WITH_CADDY_VOLUME_ID   # terraform output caddy_volume_id
    volumeAttributes:
      com.digitalocean.csi/noformat: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
spec:
  storageClassName: do-block-storage
  volumeName: finguard-caddy
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: public-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate          # single writer on the ReadWriteOnce certificate volume
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
        app.kubernetes.io/component: public-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          # lets the non-root process bind 80/443 without extra capabilities
          # (a "safe" sysctl, allowed by the restricted Pod Security Standard)
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: caddy
          image: caddy:2.11.7
          env:
            - name: PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: finguard-public
                  key: PUBLIC_HOST
            - name: XDG_DATA_HOME
              value: /data
            - name: XDG_CONFIG_HOME
              value: /config
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-public
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: finguard-public
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
