# Prometheus config for docker-compose (static target). Alert rules and Grafana
# provisioning are shared with the Helm chart: k8s/charts/finguard/files/.
# The Kubernetes variant (pod discovery) is k8s/charts/finguard/files/prometheus/prometheus.yml.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: finguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          app: finguard-api

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
